name: Deploy to AWS (dev)

# Manual. Runs from any branch, so a phase branch can be tried in dev before it merges.
# Touches dev resources only: the dev deploy role cannot update prod services or run prod tasks.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Reset and reseed synthetic data after deploying"
        type: choice
        options: ["no", "reset"]
        default: "no"
      users:
        description: "Bulk random users on top of the scenario accounts (when seeding)"
        type: string
        default: "60"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.DEV_AWS_DEPLOY_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_API_SERVICE: ${{ vars.DEV_ECS_API_SERVICE }}
  ECS_API_FAMILY: ${{ vars.DEV_ECS_API_FAMILY }}
  ECS_MIGRATE_FAMILY: ${{ vars.DEV_ECS_MIGRATE_FAMILY }}
  ECS_SEED_FAMILY: ${{ vars.DEV_ECS_SEED_FAMILY }}
  SUBNETS: ${{ vars.MIGRATE_SUBNETS }}
  SECURITY_GROUP: ${{ vars.MIGRATE_SECURITY_GROUP }}
  API_HEALTH_URL: ${{ vars.DEV_API_HEALTH_URL }}

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://healthuser:healthpassword@localhost:5433/myhealthapp_dev
      STORAGE_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Native ARM runner: no QEMU emulation (Node crashed under it with "Illegal instruction").
  build:
    name: Build the ARM image (native)
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, dev role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a re-run for the same commit reuses the image already pushed.
      - name: Build and push unless this commit's image exists
        run: |
          set -euo pipefail
          uri="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          if docker manifest inspect "$uri" > /dev/null 2>&1; then
            echo "Image for ${GITHUB_SHA} already in ECR; skipping the build"
            exit 0
          fi
          docker build -t "$uri" .
          docker push "$uri"

  deploy:
    name: Migrate, deploy (dev)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the users input
        run: |
          case "${{ inputs.users }}" in (''|*[!0-9]*) echo "users must be a whole number"; exit 1;; esac

      - name: Configure AWS credentials (OIDC, dev role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image for this commit
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Register dev task definition revisions
        id: taskdefs
        run: |
          set -euo pipefail
          register() {
            family="$1"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition \
              | jq --arg image "${{ steps.image.outputs.uri }}" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
                  | .containerDefinitions[0].image = $image' > "/tmp/${family}.json"
            aws ecs register-task-definition --cli-input-json "file:///tmp/${family}.json" \
              --query taskDefinition.taskDefinitionArn --output text
          }
          echo "migrate=$(register "$ECS_MIGRATE_FAMILY")" >> "$GITHUB_OUTPUT"
          echo "seed=$(register "$ECS_SEED_FAMILY")" >> "$GITHUB_OUTPUT"
          echo "api=$(register "$ECS_API_FAMILY")" >> "$GITHUB_OUTPUT"

      - name: Run a one-shot task and wait for it
        id: runner
        run: |
          cat > /tmp/run-task.sh <<'EOF'
          set -euo pipefail
          taskdef="$1"; shift
          overrides="${1:-}"
          args=(--cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$taskdef"
                --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}"
                --query 'tasks[0].taskArn' --output text)
          if [ -n "$overrides" ]; then args+=(--overrides "$overrides"); fi
          arn=$(aws ecs run-task "${args[@]}")
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$arn"
          code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$arn" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$code" != "0" ]; then echo "Task failed with exit code ${code}; see its CloudWatch log group."; exit 1; fi
          EOF
          chmod +x /tmp/run-task.sh

      - name: Migrate the dev schema
        run: /tmp/run-task.sh "${{ steps.taskdefs.outputs.migrate }}"

      # Deploying dev means using it: start one task even if dev-env.ps1 Stop left the count at 0.
      - name: Update the dev API
        run: aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_API_SERVICE" --task-definition "${{ steps.taskdefs.outputs.api }}" --desired-count 1 > /dev/null

      - name: Reset and reseed synthetic data
        if: inputs.seed == 'reset'
        run: |
          overrides=$(jq -cn --arg users "${{ inputs.users }}" \
            '{containerOverrides:[{name:"seed",command:["node","dist/scripts/seed-dev/index.js","--target","dev","--reset","--users",$users]}]}')
          /tmp/run-task.sh "${{ steps.taskdefs.outputs.seed }}" "$overrides"

      - name: Wait for the dev API
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_API_SERVICE"

      - name: Health check (must report deployment dev)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$API_HEALTH_URL" | grep -q '"deployment":"dev"'; then echo "Healthy (dev)"; exit 0; fi
            sleep 10
          done
          echo "Health check failed"; exit 1
