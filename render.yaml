services:
  - type: web
    name: myhealthapp-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # The image no longer migrates on boot, so Render keeps doing it here until cutover.
    dockerCommand: sh -c "prisma migrate deploy && node dist/index.js"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PREFIX
        value: "/api/v1"
      - key: AUTH_PROVIDER
        value: "node-internal"
      - key: EMAIL_VERIFICATION_REQUIRED # Temporary, until the app has verification screens (Phase 5)
        value: "false"
      - key: AI_PROVIDER_APPROVED # Owner accepted for test data only; provider is replaced in Phase 2
        value: "true"
      - key: CLIENT_URL
        value: "*"
      - key: DATABASE_URL
        sync: false # Paste Supabase IPv4 Pooler URL in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: STORAGE_PROVIDER
        value: "s3"
      - key: STORAGE_ENDPOINT
        value: "https://gmvcudlhjcxypbgvceef.storage.supabase.co/storage/v1/s3"
      - key: STORAGE_REGION
        value: "ap-south-1"
      - key: STORAGE_BUCKET
        value: "myhealthapp-documents"
      - key: STORAGE_ACCESS_KEY
        value: "1193741960e370afd7813c80c57c2b35"
      - key: STORAGE_SECRET_KEY
        sync: false # Paste Supabase Secret Access Key in Render Dashboard
      - key: STORAGE_USE_SSL
        value: "true"
